let selectedBrand='';
function normalize(str){return String(str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function rank(brand){const order=['Apple','Samsung','Motorola','Xiaomi','Realme','Infinix']; const i=order.indexOf(brand); return i>=0?i:99;}
function brands(){return [...new Set(PIXEL_PELICULAS_DATA.map(i=>i.marca).filter(Boolean))].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));}
function renderBrands(){document.getElementById('brands').innerHTML=[''].concat(brands()).map(b=>`<button class="brand-btn ${selectedBrand===b?'active':''}" onclick="selectedBrand='${String(b).replace(/'/g,"\\'")}';render()">${b||'Todas'}</button>`).join('');}
function card(item){const chips=(item.modelos_compativeis||[]).map(c=>`<span class="chip">${c}</span>`).join('')||'<span class="chip">Nenhum compatível cadastrado</span>'; return `<article class="pixel-card"><div class="pixel-icon"><i class="ti ti-device-mobile"></i></div><div><h3>${item.modelo_principal}</h3><p>${item.marca} • compatibilidade liberada</p></div><span class="pill">${(item.modelos_compativeis||[]).length} compatíveis</span><div class="compat">${chips}</div></article>`;}
function render(){const q=normalize(document.getElementById('search').value); let filtered=PIXEL_PELICULAS_DATA.filter(item=>{const t=normalize(item.modelo_principal+' '+item.marca+' '+(item.modelos_compativeis||[]).join(' ')); return (!q||t.includes(q)) && (!selectedBrand||item.marca===selectedBrand);}).sort((a,b)=>rank(a.marca)-rank(b.marca)||a.modelo_principal.localeCompare(b.modelo_principal)); renderBrands(); document.getElementById('baseCount').textContent=`${PIXEL_PELICULAS_DATA.length} modelos na base`; document.getElementById('brandCount').textContent=`${brands().length} marcas`; document.getElementById('visibleCount').textContent=`${filtered.length} resultados`; document.getElementById('list').innerHTML=filtered.map(card).join('')||'<div class="panel">Nenhum modelo encontrado.</div>';}
function clearSearch(){document.getElementById('search').value=''; selectedBrand=''; render();}
